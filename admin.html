<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALLAN Admin</title><link rel="stylesheet" href="/admin.css"></head><body><header><a href="/" class="logo">ALLAN<span>.</span></a><span>STORE CONTROL</span><a href="/">VIEW STORE ↗</a></header><main><section id="loginView" class="login"><p class="eyebrow">PRIVATE ACCESS</p><h1>ADMIN<br>LOGIN.</h1><form id="loginForm"><label>ADMIN PASSWORD</label><input type="password" id="password" required autocomplete="current-password"><button class="primary">SIGN IN ↗</button><p id="loginError" class="error"></p></form></section><section id="dashboard" hidden><div class="dash-top"><div><p class="eyebrow">ALLAN CONTROL ROOM</p><h1>YOUR STORE<span>.</span></h1></div><button id="logout" class="secondary">LOG OUT</button></div><nav class="tabs"><button class="tab active" data-tab="products">PRODUCTS</button><button class="tab" data-tab="site">WEBSITE CONTENT</button><button class="tab" data-tab="orders">ORDERS</button></nav><section id="productsPanel" class="panel"><div class="panel-head"><div><h2>PRODUCTS</h2><p>Manage your drop, pricing, images and stock.</p></div><button id="newProduct" class="primary">+ ADD PRODUCT</button></div><div id="productList" class="product-list"></div><form id="productForm" class="editor" hidden><div class="panel-head"><h2 id="formTitle">NEW PRODUCT</h2><button type="button" id="cancelProduct" class="secondary">CANCEL</button></div><input type="hidden" id="productId"><div class="form-grid"><div><label>PRODUCT NAME</label><input id="pName" required></div><div><label>PRICE (SGD)</label><input id="pPrice" type="number" min="0" step=".01" required></div><div class="wide"><label>DESCRIPTION</label><textarea id="pDescription" rows="3"></textarea></div><div class="wide"><label>PRODUCT IMAGE URL</label><input id="pImage" type="url" placeholder="https://..."></div><div><label>CATEGORY</label><input id="pCategory" value="T-shirts"></div><div><label>AVAILABLE SIZES (comma separated)</label><input id="pSizes" value="S, M, L, XL"></div><div><label>STOCK QUANTITY</label><input id="pStock" type="number" min="0" step="1" value="0" required></div><div class="checks"><label><input id="pFeatured" type="checkbox"> FEATURED PRODUCT</label><label><input id="pActive" type="checkbox" checked> VISIBLE IN STORE</label></div></div><button class="primary">SAVE PRODUCT</button><p id="productError" class="error"></p></form></section><section id="sitePanel" class="panel" hidden><div class="panel-head"><div><h2>WEBSITE CONTENT</h2><p>Edit your storefront without touching code.</p></div></div><form id="siteForm" class="editor visible"><div class="form-grid"><div><label>BRAND NAME</label><input id="sBrand"></div><div><label>ANNOUNCEMENT BAR</label><input id="sAnnouncement"></div><div><label>HOMEPAGE HEADLINE</label><input id="sHeroTitle"></div><div><label>HOMEPAGE SUBTITLE</label><input id="sHeroSubtitle"></div><div class="wide"><label>HERO BACKGROUND IMAGE URL</label><input id="sHeroImage" type="url"></div><div class="wide"><label>ABOUT ALLAN / BRAND STORY</label><textarea id="sAbout" rows="5"></textarea></div><div><label>CONTACT EMAIL</label><input id="sEmail" type="email"></div><div><label>INSTAGRAM URL</label><input id="sInstagram" type="url" placeholder="https://instagram.com/..."></div></div><button class="primary">SAVE WEBSITE CHANGES</button><p id="siteMessage" class="success"></p></form></section><section id="ordersPanel" class="panel" hidden><div class="panel-head"><div><h2>ORDERS</h2><p>Recent customer orders and payment status.</p></div><button id="refreshOrders" class="secondary">REFRESH</button></div><div id="ordersList"></div></section></section></main><script src="/admin.js"></script></body></html>
